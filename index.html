<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Akikah Nadhif Althafi</title>
  <style>
    /* Mengatur iframe agar memenuhi seluruh layar tanpa scrollbar berlebih */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Element iframe untuk menampilkan Web App Apps Script -->
  <iframe id="webAppFrame" src=""></iframe>

  <script>
    // URL dasar Google Apps Script Anda
    const baseUrl = "https://script.google.com/macros/s/AKfycbxgYx0PgTjay_uttFYEJU7_8VyGgcd9D_a-FDzJnpKYjW7CVHGZpY1RifSF8lThYVYp/exec";
    
    // Mengambil parameter pencarian dari URL GitHub (misal: ?to=NamaTamu)
    const urlParams = window.location.search;
    
    // Menggabungkan URL Apps Script dengan parameter tamu
    document.getElementById("webAppFrame").src = baseUrl + urlParams;
  </script>

</body>
</html>
